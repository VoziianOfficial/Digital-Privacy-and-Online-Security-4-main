<!doctype html>
<meta charset="utf-8">
<title>Header audit</title>
<pre id="output">running</pre>
<iframe id="frame" src="/index.html" style="width:1366px;height:900px;border:0"></iframe>
<script>
  const frame = document.getElementById("frame");
  const output = document.getElementById("output");
  const results = [];

  const sleep = (ms) =>
    new Promise((resolve) => setTimeout(resolve, ms));

  const waitFrameLoad = () =>
    new Promise((resolve) => {
      frame.addEventListener("load", resolve, {
        once: true
      });
    });

  const capture = (label) => {
    const win = frame.contentWindow;
    const doc = frame.contentDocument;
    const header = doc.querySelector(".site-header");
    const loader = doc.querySelector(".page-loader");
    const panel = doc.querySelector(".page-transition__panel");
    const rect = header.getBoundingClientRect();
    const styles = win.getComputedStyle(header);

    results.push({
      label,
      path: win.location.pathname,
      opacity: styles.opacity,
      visibility: styles.visibility,
      transform: styles.transform,
      position: styles.position,
      top: styles.top,
      height: Math.round(rect.height),
      y: Math.round(rect.y),
      zIndex: styles.zIndex,
      pointerEvents: styles.pointerEvents,
      background: styles.backgroundColor,
      loaderHidden: loader.classList.contains("is-hidden"),
      panelTransform: win.getComputedStyle(panel).transform,
      menuOpen: doc.body.classList.contains("menu-open")
    });
  };

  const clickAndWait = async (predicate) => {
    const link = Array.from(
      frame.contentDocument.querySelectorAll("a[href]")
    ).find((anchor) => predicate(
      new URL(anchor.href),
      anchor
    ));

    if (!link) {
      throw new Error("Navigation link was not found.");
    }

    const pending = waitFrameLoad();
    link.click();
    await pending;
  };

  (async () => {
    await waitFrameLoad();
    capture("home:first-load");
    await sleep(900);
    capture("home:after-loader");

    await clickAndWait((url) =>
      url.pathname.endsWith("/services/privacy-protection.html")
    );
    capture("service:after-navigation");
    await sleep(350);
    capture("service:after-transition");

    await clickAndWait((url) =>
      url.pathname.endsWith("/privacy.html")
    );
    capture("legal:after-navigation");
    await sleep(350);
    capture("legal:after-transition");

    await clickAndWait((url) =>
      url.pathname.endsWith("/index.html")
    );
    capture("home-return:after-navigation");
    await sleep(350);
    capture("home-return:after-transition");

    frame.contentWindow.history.back();
    await waitFrameLoad();
    capture("back:after-pageshow");
    await sleep(350);
    capture("back:after-settle");

    frame.contentWindow.history.forward();
    await waitFrameLoad();
    capture("forward:after-pageshow");
    await sleep(350);
    capture("forward:after-settle");

    output.textContent = JSON.stringify(results, null, 2);
    document.body.setAttribute("data-done", "true");
  })().catch((error) => {
    output.textContent = error.stack || String(error);
    document.body.setAttribute("data-done", "error");
  });
</script>
